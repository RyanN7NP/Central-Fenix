<!doctype html>
<html lang="pt-br">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phoenix Link</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class>
    <div id="container">
      <!--DIV - Block-->
      <div id="profile">
        <img
          src="./assets/avatar.png"
          alt="Imagem de um personagem chamado Fenix"
        />
        <p>@ryan_fanart</p>
      </div>
      <div id="switch" onclick="toggleMode()">
        <!-- Isso é uma função -->
        <button></button>
        <span></span>
      </div>

      <ul>
        <li>
          <a href="#">Inscrever-se no NLW</a>
        </li>
        <li>
          <a href="#">Baixar meu e-book</a>
        </li>
        <li>
          <a href="https://www.instagram.com/ryan_fanart/" target="_blank"
            >Ver meu portifolio</a
          >
        </li>
        <li>
          <a href="https://rocketseat.com.br/Explorer" target="_blank"
            >Conheça o Explorer</a
          >
        </li>
      </ul>
      <div id="social-links">
        <a href="https://github.com/maykbrito" target="_blank">
          <ion-icon name="logo-github"></ion-icon>
        </a>
        <a href="https://www.instagram.com/ryan_fanart" target="_blank">
          <ion-icon name="logo-instagram"></ion-icon>
        </a>
        <a href="https://www.youtube.com/alanzoka" target="_blank">
          <ion-icon name="logo-youtube"></ion-icon>
        </a>
        <a href="https://www.linkedin.com/in/ryansilvasoares/" target="_blank">
          <ion-icon name="logo-linkedin"></ion-icon>
        </a>
      </div>
      <footer>
        Feito com
        <ion-icon name="heart"></ion-icon> por
        <a
          href="https://www.instagram.com/ryan_fanart "
          class="link-rodape"
          target="_blank"
        >
          ryan_fanart
        </a>
      </footer>
      <div id="rodape">
        <p>Feito com <ion-icon name="heart"></ion-icon> por ryan_fanart</p>
      </div>
    </div>
    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
    <script src="./script.js"></script>
  </body>
</html>
